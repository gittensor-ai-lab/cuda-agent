[project]
name = "cuda-agent"
version = "0.1.0"
description = "Autonomous CUDA optimization agent for sparkinfer, driven by Gittensor Compute"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cuda-agent = "cuda_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuda_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
